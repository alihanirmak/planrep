services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: planrep:latest
    ports:
      - "3000:3000"
    environment:
      # Production icin ZORUNLU: en az 16 karakter, gizli ve kalici bir deger verin.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET env degiskeni gerekli (en az 16 karakter)}
      DATABASE_PATH: /app/data/planrep.db
      # SAP/AXET entegrasyon binary'si container icinde yoksa AI sorgu uctan
      # devre disi kalsin diye varsayilan olarak kapali; gerekirse 0 yapin.
      AXET_DISABLE: ${AXET_DISABLE:-1}
      # Zamanlanmis veri yenileme (POST /api/cron/sync) icin paylasimli sir.
      # Tanimlanmazsa bu uc 503 doner (varsayilan olarak acik/korumasiz
      # birakilmaz). Harici bir cron/webhook (OS crontab, k8s CronJob, GitHub
      # Actions scheduled workflow) bu ucu "X-Cron-Secret: $CRON_SECRET"
      # header'iyla periyodik olarak cagirmalidir; bkz. docs/ROADMAP.md.
      CRON_SECRET: ${CRON_SECRET:-}
      # SSO (OIDC). Hepsi bos ise login sayfasinda SSO butonu gosterilmez.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      SSO_DEFAULT_ROLE: ${SSO_DEFAULT_ROLE:-viewer}
      SSO_PROVIDER_LABEL: ${SSO_PROVIDER_LABEL:-}
    volumes:
      - planrep-data:/app/data
    restart: unless-stopped

  # Tek seferlik yedek almak icin: docker compose run --rm backup
  backup:
    image: planrep:latest
    profiles: ["tools"]
    environment:
      DATABASE_PATH: /app/data/planrep.db
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
    volumes:
      - planrep-data:/app/data
    entrypoint: ["node", "scripts/backup-db.js"]

volumes:
  planrep-data:
